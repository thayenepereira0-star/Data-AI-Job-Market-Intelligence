name: Himalayas connector tests

on:
  push:
    branches:
      - "feat/dai-65-himalayas-extraction"
    paths:
      - "src/ingestion/himalayas_extractor.py"
      - "src/ingestion/extract_himalayas.py"
      - "tests/test_himalayas_extractor.py"
      - "requirements-v2.txt"
      - ".github/workflows/himalayas-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v2.txt
      - name: Run Himalayas unit tests (mocked HTTP only)
        run: python -m unittest tests.test_himalayas_extractor -v
