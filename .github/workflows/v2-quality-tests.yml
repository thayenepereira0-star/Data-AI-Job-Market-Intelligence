name: V2 quality diagnostics tests

on:
  push:
    branches:
      - feat/v2-quality-diagnostics
  pull_request:
    paths:
      - "src/processing/v2_quality.py"
      - "src/run_v2.py"
      - "src/database/inspect_v2_db.py"
      - "tests/test_v2_quality.py"
      - ".github/workflows/v2-quality-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-v2.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
