name: Multisource orchestrator tests

on:
  push:
    branches:
      - "feat/dai-66-multisource-orchestrator"
    paths:
      - "src/ingestion/orchestrator.py"
      - "src/ingestion/run_multisource.py"
      - "tests/test_orchestrator.py"
      - "requirements-v2.txt"
      - ".github/workflows/multisource-orchestrator-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v2.txt
      - name: Run orchestrator tests (simulated connectors only)
        run: python -m unittest discover -s tests -p "test_orchestrator.py" -v
