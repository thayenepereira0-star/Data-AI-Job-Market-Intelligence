name: DAI-29 API normalization tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-v2.txt"
      - ".github/workflows/dai-29-tests.yml"
  push:
    branches:
      - "feat/dai-29-normalize-api-jobs"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-v2.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
