name: DAI-30 PostgreSQL integration

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "sql/**"
      - ".github/workflows/dai-30-postgres-integration.yml"
  push:
    branches:
      - "feat/dai-30-incremental-api-load"

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobmarket
          POSTGRES_USER: jobmarket
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobmarket -d jobmarket"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jobmarket
      POSTGRES_USER: jobmarket
      POSTGRES_PASSWORD: ci-test-only-password
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-v2.txt
      - name: Verify insert then idempotent replay on isolated PostgreSQL
        run: python -m unittest tests.test_api_job_loader_integration -v
