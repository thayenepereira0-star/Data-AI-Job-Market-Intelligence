name: V2 Python unit tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-v2.txt"
      - ".github/workflows/v2-python-tests.yml"
  push:
    branches:
      - "feat/dai-28-adzuna-extraction"
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-v2.txt"
      - ".github/workflows/v2-python-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v2.txt
      - name: Run unit tests (no external API or database)
        run: python -m unittest discover -s tests -p "test_*.py" -v
