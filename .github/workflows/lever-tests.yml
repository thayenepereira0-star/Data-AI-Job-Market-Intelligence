name: Lever connector tests

on:
  push:
    branches:
      - "feat/dai-67-lever-extraction"
    paths:
      - "src/ingestion/lever_extractor.py"
      - "src/ingestion/extract_lever.py"
      - "tests/test_lever_extractor.py"
      - "requirements-v2.txt"
      - ".github/workflows/lever-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v2.txt
      - name: Run Lever unit tests (mocked HTTP only)
        run: python -m unittest discover -s tests -p "test_lever_extractor.py" -v
